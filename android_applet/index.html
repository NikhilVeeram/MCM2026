<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoDrain Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="status-bar">
                <span id="time">18:16</span>
                <div class="os-icons">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M12.01 21.49L23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7l11.63 14.49.01.01.01-.01z"
                            fill="currentColor" />
                    </svg>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M17 7H7c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2z"
                            fill="currentColor" />
                        <path d="M21 11v2h1v-2h-1z" fill="currentColor" />
                    </svg>
                </div>
            </div>
            <div class="header-content">
                <h1>EcoDrain</h1>
                <p class="subtitle">System Battery Intelligence</p>
            </div>
        </header>

        <main>
            <!-- Battery Circular Visualization -->
            <section class="battery-main">
                <div class="glass-orb">
                    <div class="percentage-container">
                        <span id="soc-value">84</span><span class="unit">%</span>
                        <p class="status">DISCHARGING</p>
                    </div>
                    <svg class="progress-ring" viewBox="0 0 100 100">
                        <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="ring-progress" cx="50" cy="50" r="45" id="soc-ring"></circle>
                    </svg>
                </div>
                <div class="tte-info">
                    <span class="label">Time to Empty</span>
                    <span class="value" id="tte-value">05h 42m</span>
                </div>
            </section>

            <!-- Real-time Markers -->
            <section class="markers-grid">
                <div class="marker-card" id="marker-cpu">
                    <div class="marker-header">
                        <svg class="marker-icon" viewBox="0 0 24 24">
                            <path
                                d="M15 9h-2v2h2V9zm-4 0H9v2h2V9zm-4 0H5v2h2V9zm12 0h-2v2h2V9zM7 13H5v2h2v-2zm4 0H9v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zM3 3v18h18V3H3zm16 16H5V5h14v14z"
                                fill="currentColor" />
                        </svg>
                        <span class="marker-label">CPU Load</span>
                    </div>
                    <div class="marker-value"><span id="cpu-load">42</span>%</div>
                    <div class="mini-graph" id="cpu-graph"></div>
                </div>

                <div class="marker-card" id="marker-screen">
                    <div class="marker-header">
                        <svg class="marker-icon" viewBox="0 0 24 24">
                            <path
                                d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"
                                fill="currentColor" />
                        </svg>
                        <span class="marker-label">OLED Ratio</span>
                    </div>
                    <div class="marker-value"><span id="screen-ratio">0.32</span></div>
                    <div class="mini-graph" id="screen-graph"></div>
                </div>

                <div class="marker-card" id="marker-network">
                    <div class="marker-header">
                        <svg class="marker-icon" viewBox="0 0 24 24">
                            <path d="M2 22h20V2L2 22z" fill="currentColor" />
                        </svg>
                        <span class="marker-label">Signal State</span>
                    </div>
                    <div class="marker-value"><span id="signal-strength">-92</span> dBm</div>
                    <div class="mini-graph" id="network-graph"></div>
                </div>

                <div class="marker-card" id="marker-temp">
                    <div class="marker-header">
                        <svg class="marker-icon" viewBox="0 0 24 24">
                            <path
                                d="M15 13V5c0-1.66-1.34-3-3-3S9 3.34 9 5v8c-1.21.91-2 2.37-2 4 0 2.76 2.24 5 5 5s5-2.24 5-5c0-1.63-.79-3.09-2-4zm-3-1c.55 0 1 .45 1 1h-2c0-.55.45-1 1-1z"
                                fill="currentColor" />
                        </svg>
                        <span class="marker-label">Temperature</span>
                    </div>
                    <div class="marker-value"><span id="temp-value">34</span>°C</div>
                    <div class="mini-graph" id="temp-graph"></div>
                </div>
            </section>

            <!-- Optimization Section -->
            <section class="optimization">
                <h2>Optimization Engine</h2>
                <div class="lpm-toggle">
                    <div class="toggle-text">
                        <span class="primary">Low Power Mode</span>
                        <span class="secondary">Enable system-wide throttling</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="lpm-checkbox">
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="recommendation-card">
                    <div class="rec-icon">✨</div>
                    <div class="rec-content">
                        <h3>ECO-TIP</h3>
                        <p id="recommendation">Switching to Dark Mode could extend your battery by <span
                                class="highlight">84 minutes</span>.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
